appId: cloud.pc2005.dsh-pet
productName: 哦鲸鲸
electronVersion: 43.3.0
asar: false
directories:
  output: portable-dist/personal
extraMetadata:
  main: desktop-main.cjs
  dshPetEdition: personal
  description: 哦鲸鲸
files:
  - desktop-main.cjs
  - package.json
  - lib/standalone.js
  - lib/standalone-settings.js
  - lib/*.js
  - runtime/electron-helper/**
  - assets/config.jsonc
  - assets/dsh-pet-icon-16.png
  - assets/dsh-pet-icon-256.png
  - assets/dsh-pet-icon.ico
  - assets/logo.png
  - assets/logo-rounded.png
  - assets/webm/**
  - assets/fonts/**
  - assets/pic/**
  - assets/memes/**
  - assets/sound/**
  - node_modules/@electron/get/**
  - node_modules/@electron-internal/extract-zip/**
  - node_modules/koffi/**
  - node_modules/.pnpm/@koromix+koffi-win32-x64@*/node_modules/@koromix/koffi-win32-x64/**
  - '!**/*.map'
  - '!**/*.test.*'
win:
  icon: assets/dsh-pet-icon.ico
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: 哦鲸鲸-${version}-portable-personal.${ext}
