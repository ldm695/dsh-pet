appId: cloud.pc2005.dsh-pet
productName: 哦鲸鲸
electronVersion: 43.3.0
asar: false
directories:
  output: portable-dist/personal
extraMetadata:
  main: desktop-main.cjs
  dshPetEdition: personal
  description: 哦鲸鲸
files:
  - lib/**
  - runtime/**
  # 素材只带运行时要用的五类：动画（webm）、字体、表情包、头像、点击音效；
  # `assets/preview` 是 README 的 GIF（64 MB），插件自己的 files 白名单也不发它，这里同样排除。
  # 这份清单与 package.json 的 files 是两处独立真相：新增素材目录时必须两边都加，
  # 否则插件模式（读真实文件）正常、打包应用（读 asar）里那个功能静默失效。
  - assets/webm/**
  - assets/fonts/**
  - assets/pic/**
  - assets/memes/**
  - assets/sound/**
  - assets/config.jsonc
  - assets/logo.png
  - package.json
  - '!node_modules/**'

asar: true
npmRebuild: false

# 与 package.json 的 @electron/get 默认下载版本保持一致；改版本时两处一起改
electronVersion: 43.3.0
# electronDist 由 scripts/dist.mjs 经 `--config.electronDist=<本机解压目录>` 传入：
# 这个字段不做 ${env.*} 宏展开（实测会原样当成路径），所以不能写死在 YAML 里。

# 只出「解包目录」一种形态：分发时把 win-unpacked 整个压成 zip 即可（绿色版）。
# 不做 portable（每次启动自解压，慢）也不做 nsis（安装包对自用场景没有增量价值）——
# 真要回归安装包，把 target 改回 [nsis] 并补回 nsis 段（向导/快捷方式/卸载登记）即可。
win:
  icon: assets/dsh-pet-icon.ico
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: 哦鲸鲸-${version}-portable-personal.${ext}
