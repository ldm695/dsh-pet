extends: electron-builder.yml
appId: cloud.ldm695.dsh-pet.public
productName: DSH Pet
directories:
  output: dist-app/public
extraMetadata:
  main: lib/app.js
  dshPetEdition: public
  dshPetDisplayName: DSH Pet
  dshPetAppUserModelId: cloud.ldm695.dsh-pet.public
  dshPetTrayIcon: logo.png
  description: DSH Pet 桌面宠物
files:
  - lib/**
  - runtime/**
  - assets/webm/**
  - assets/fonts/**
  - assets/pic/**
  - assets/memes/**
  - assets/sound/**
  - assets/config.jsonc
  - assets/logo.png
  - assets/dsh-pet-icon-public.ico
  - package.json
  - from: node_modules/.pnpm/koffi@3.3.3/node_modules/koffi
    to: node_modules/koffi
  - from: node_modules/.pnpm/@koromix+koffi-win32-x64@3.3.3/node_modules/@koromix/koffi-win32-x64
    to: node_modules/@koromix/koffi-win32-x64
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-win32-x64/**
win:
  icon: assets/dsh-pet-icon-public.ico
  target:
    - dir
portable:
  artifactName: DSH-Pet-${version}-portable.${ext}
